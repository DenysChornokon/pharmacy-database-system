<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Адміністратор - Pharmacy System</title>
  <link rel="stylesheet" href="./css/panel.css" />
</head>
<body>
  <header class="header loged_header_container">
    <h1>Панель адміністратора</h1>
    <button onclick="showAddDrugForm()" class="header-button" id="add-drug-button" >Додати препарат</button>
    <button onclick="showEditDrugForm()" class="header-button" id="edit-drug-button">Редагувати препарат</button>
    <button onclick="showDeleteDrugForm()" class="header-button" id="delete-drug-button">Видалити препарат</button>
    <button onclick="showManageDiscounts()" class="header-button" id="manage-discounts-button">Управління знижками</button>
    <button onclick="showClientData()" class="header-button" id="view-customers-button">Дані про клієнтів</button>
  </header>
  
<div class="container">
    <!-- Ліва секція для перегляду препаратів -->
    <aside class="sidebar">
      <button onclick="viewDrugs()" class="view-drugs-button" id="view-drugs-button">Переглянути препарати</button>
      <div id="drug-list" class="drug-list">
        <!-- Тут виводитиметься список препаратів -->
      </div>
    </aside>

    <!-- Права секція для форми додавання препарату -->
    
  <div id="content-area" class="content-area"></div>



  </div>

  <script src="admin.js"></script>
</body>
</html>
